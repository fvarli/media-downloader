[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "media-downloader"
dynamic = ["version"]
description = "Cross-platform command-line downloader for public media URLs, built on yt-dlp and FFmpeg."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "Ferzender Varli" }]
keywords = ["yt-dlp", "ffmpeg", "download", "video", "audio", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Video",
]

# yt-dlp[default] (not bare yt-dlp): bare yt-dlp declares zero required
# dependencies, while the "default" extra provides yt-dlp-ejs, websockets,
# pycryptodomex (AES-encrypted HLS), brotli, certifi, mutagen, requests and
# urllib3 -- the baseline a real downloader needs.
#
# The lower bound tracks the current stable release and there is deliberately
# no upper bound, so `pip install -U yt-dlp` always pulls in extractor fixes.
dependencies = [
    "yt-dlp[default]>=2026.8.19",
    "rich>=13.0",
]

[project.optional-dependencies]
# Optional JavaScript runtime used by yt-dlp for YouTube's JS challenges.
# yt-dlp-ejs ships the JS source but still needs a runtime to execute it;
# a system-wide Deno, Node or Bun works just as well as this wheel.
js = ["yt-dlp[deno]>=2026.8.19"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
]
# Building standalone artifacts. Never a runtime dependency: the frozen
# application does not contain PyInstaller, only its bootloader.
packaging = ["pyinstaller>=6.22,<7"]

[project.scripts]
media-downloader = "media_downloader.cli:main"

[project.urls]
Homepage = "https://github.com/fvarli/media-downloader"
Repository = "https://github.com/fvarli/media-downloader"
Issues = "https://github.com/fvarli/media-downloader/issues"

[tool.hatch.version]
path = "src/media_downloader/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/media_downloader"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "PTH", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unreachable = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["yt_dlp.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
