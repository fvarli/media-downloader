name: Standalone build

# Validation only. This workflow builds and exercises the frozen application on
# each platform; it never publishes anything. There is no tag, no release and
# deliberately no write permission -- artifacts are uploaded purely so a human
# can download and inspect them.
#
# It runs on demand, and automatically only when something that can actually
# affect the packaged application changes. The 12-job source CI remains the
# always-on compatibility gate.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'packaging/**'
      - 'src/media_downloader/**'
      - 'pyproject.toml'
      - '.github/workflows/standalone-build.yml'

permissions:
  contents: read

env:
  # One pinned interpreter for every artifact. The source CI keeps proving
  # 3.10-3.13; the build interpreter is a packaging detail and does not
  # redefine which Python versions the project supports.
  PYTHON_VERSION: '3.12'

jobs:
  # The compatibility fixture is manufactured once, here, and handed to every
  # platform. It has to be: our macOS FFmpeg can *decode* VP9 but not encode
  # it, and encoding VP9 is not something a user ever needs it to do. Building
  # the fixture centrally keeps macOS testing the exact shape that failed on a
  # real iPhone -- VP9 video with non-AAC audio in MP4 -- instead of a weaker
  # stand-in chosen to suit the runner.
  fixture:
    name: Compatibility fixture
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install the project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Build a VP9 + Opus MP4 with the managed FFmpeg
        run: |
          python - <<'EOF'
          import pathlib
          import subprocess

          from media_downloader.tools.manager import ToolManager

          root = pathlib.Path("tooling").resolve()
          env = {k: str(root) for k in ("XDG_DATA_HOME", "LOCALAPPDATA", "HOME", "USERPROFILE")}
          installed = ToolManager(env=env).install("ffmpeg")
          out = pathlib.Path("media")
          out.mkdir(exist_ok=True)
          subprocess.run(
              [
                  str(installed / "ffmpeg"), "-hide_banner", "-loglevel", "error", "-y",
                  "-f", "lavfi", "-i", "testsrc=size=160x120:rate=10:duration=1",
                  "-f", "lavfi", "-i", "sine=frequency=440:duration=1",
                  "-c:v", "libvpx-vp9", "-b:v", "150k", "-pix_fmt", "yuv420p",
                  "-c:a", "libopus", "-shortest", str(out / "incompatible.mp4"),
              ],
              check=True,
          )
          print(subprocess.run(
              [str(installed / "ffprobe"), "-v", "error", "-show_entries",
               "stream=codec_name,codec_type,pix_fmt", "-of",
               "default=noprint_wrappers=1", str(out / "incompatible.mp4")],
              capture_output=True, text=True, check=True).stdout)
          EOF

      - uses: actions/upload-artifact@v7
        with:
          name: compatibility-fixture
          path: media/incompatible.mp4
          retention-days: 1
          if-no-files-found: error

  build:
    name: ${{ matrix.label }}
    needs: fixture
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS and Windows build the shape a user would actually
          # double-click: windowed, no terminal. Nothing about the packaging
          # changes -- only whether a console is attached -- but that is
          # precisely the difference nobody had exercised, and it is the
          # difference that makes stdout unavailable to CI.
          - label: macOS arm64 (windowed)
            os: macos-latest
            windowed: '1'
            mode: windowed
            target: macos
            artifact_path: dist/Media Downloader.app
            exe: dist/Media Downloader.app/Contents/MacOS/media-downloader
            archive: Media-Downloader-macOS-arm64-windowed.zip
            extracted: package/extracted/Media Downloader.app
          - label: Windows x64 (windowed)
            os: windows-latest
            windowed: '1'
            mode: windowed
            target: windows
            artifact_path: dist/media-downloader
            exe: dist/media-downloader/media-downloader.exe
            archive: Media-Downloader-Windows-x64-windowed.zip
            extracted: package/extracted/media-downloader
          # The same commit and the same spec, console this time. When Windows
          # next fails silently there is something that can be run in a
          # terminal to find out why -- which is exactly what was missing when
          # a windowed build exited before it could write a single log line.
          - label: Windows x64 (console diagnostic)
            os: windows-latest
            windowed: '0'
            mode: console
            target: windows
            artifact_path: dist/media-downloader
            exe: dist/media-downloader/media-downloader.exe
            archive: Media-Downloader-Windows-x64-console.zip
            extracted: package/extracted/media-downloader

          # Linux has no windowed/console distinction to make, and a console
          # build keeps one artifact where printed output is still checked.
          - label: Linux x86_64 (console)
            # Oldest available runner, for the lowest practical glibc floor.
            os: ubuntu-22.04
            windowed: '0'
            mode: console
            target: linux
            artifact_path: dist/media-downloader
            exe: dist/media-downloader/media-downloader
            archive: Media-Downloader-Linux-x86_64.tar.gz
            extracted: package/extracted/media-downloader

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install project and packaging tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,packaging]"

      - name: Build the frozen application
        env:
          MD_WINDOWED_BUILD: ${{ matrix.windowed }}
        run: python -m PyInstaller packaging/media-downloader.spec --noconfirm

      # Deterministic and offline. This is the check that must stay green: it
      # exercises the built executable, not the source tree.
      - name: Smoke-test the artifact
        run: python packaging/smoke_test.py "${{ matrix.artifact_path }}" --mode ${{ matrix.mode }}

      - name: Managed Deno install and discovery
        run: python packaging/tool_check.py deno

      - name: Managed FFmpeg install and discovery
        # No macOS entry exists: no provider was found that meets the
        # licensing and provenance requirements, so the tool_check reports it
        # as unsupported rather than pretending.
        run: python packaging/tool_check.py ffmpeg

      # -- the archive a human will actually download --------------------
      #
      # Built here, on the native runner, rather than left to the artifact
      # upload. GitHub documents that its upload does not preserve file
      # permissions -- everything arrives as 644 -- which would leave the
      # macOS .app unable to launch at all. Packing it ourselves keeps the
      # executable bit, and keeps build leftovers out: a windowed macOS build
      # leaves both the .app and PyInstaller's COLLECT directory in dist/, and
      # uploading dist/ wholesale sent both.
      - name: Pack the distributable archive (macOS)
        if: matrix.target == 'macos'
        run: |
          mkdir -p package
          # ditto is Apple's own tool and the one Archive Utility is built on,
          # so what it stores is what the tester's Finder will restore.
          ditto -c -k --sequesterRsrc --keepParent \
            "${{ matrix.artifact_path }}" "package/${{ matrix.archive }}"

      - name: Pack the distributable archive (Windows)
        if: matrix.target == 'windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package | Out-Null
          # ZipFile.CreateFromDirectory rather than Compress-Archive: its
          # includeBaseDirectory argument says explicitly that the payload
          # folder is the archive root, instead of depending on how
          # Compress-Archive interprets a directory path.
          $source = (Resolve-Path "${{ matrix.artifact_path }}").Path
          $target = Join-Path (Resolve-Path package).Path "${{ matrix.archive }}"
          Add-Type -AssemblyName System.IO.Compression.FileSystem -ErrorAction SilentlyContinue
          [System.IO.Compression.ZipFile]::CreateFromDirectory(
            $source, $target, [System.IO.Compression.CompressionLevel]::Optimal, $true)
          Get-Item $target | Select-Object Name, Length

      - name: Pack the distributable archive (Linux)
        if: matrix.target == 'linux'
        run: |
          mkdir -p package
          tar -czf "package/${{ matrix.archive }}" -C dist media-downloader

      # Extracts with the platform's own tool and checks what an archive round
      # trip is known to destroy: the executable bit, the bundle structure,
      # and whether anything unwanted came along.
      # One line on purpose: the default shell on Windows is pwsh, where a
      # trailing backslash is not a line continuation.
      - name: Verify the archive extracts correctly
        run: python packaging/verify_package.py "package/${{ matrix.archive }}" package/extracted --platform ${{ matrix.target }}

      # The point of the whole exercise: the smoke test now runs against the
      # extracted archive, which is exactly what the tester will double-click,
      # rather than against the build directory it came from.
      - name: Smoke-test the extracted archive
        run: python packaging/smoke_test.py "${{ matrix.extracted }}" --mode ${{ matrix.mode }}

      # Install the FFmpeg this application installs for its own users. It is
      # the only FFmpeg available here at all: every runner reported "no
      # FFmpeg" on the first attempt, which made the check skip everywhere and
      # prove nothing.
      #
      # Deliberately NOT added to PATH. It used to be, and that is precisely
      # why this gate stayed green through the bug it was supposed to catch:
      # on PATH, the application finds ffmpeg and ffprobe by bare name and
      # never exercises its own discovery, so the check proved only that the
      # frozen binary can run an FFmpeg somebody else provided. Leaving it off
      # PATH reproduces the machine that failed -- a managed install and
      # nothing else -- and makes discovery the thing under test.
      - name: Provide the managed FFmpeg for the media check
        shell: bash
        run: |
          python - <<'EOF'
          import os
          import pathlib

          from media_downloader.tools.manager import ToolManager

          root = pathlib.Path("tooling").resolve()
          env = {k: str(root) for k in ("XDG_DATA_HOME", "LOCALAPPDATA", "HOME", "USERPROFILE")}
          manager = ToolManager(env=env)
          if manager.spec_for("ffmpeg") is None:
              print("No verified FFmpeg source for this platform; the media check will skip.")
              raise SystemExit(0)
          installed = manager.install("ffmpeg")
          print(f"managed FFmpeg installed at {installed}")
          # The native form of the path: on Windows the shell's $PWD is a
          # POSIX-style Git Bash path that the frozen application cannot use.
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as handle:
              handle.write(f"MD_TOOLING_ROOT={root}\n")
          EOF

      # Requirement of this phase: put a genuinely incompatible file through the
      # *packaged* application -- its bundled code and its FFmpeg discovery --
      # rather than through the source checkout, which proves nothing about
      # what was shipped. Honest about its own limits: if the runner has no
      # FFmpeg, or cannot encode the fixture, it says so instead of passing
      # quietly. HE-AAC is deliberately not attempted; producing it needs the
      # nonfree libfdk_aac, and the native encoder is LC-only.
      # A real Windows machine could not install FFmpeg or Deno --
      # CERTIFICATE_VERIFY_FAILED -- while CI stayed green, because runners
      # have complete certificate stores and ours never asked for a CA bundle
      # at all. The download succeeding here proves little on a healthy
      # runner; the trust sources are the part that does not depend on the
      # machine, so the self-test asserts those and then makes a real request.
      - name: Packaged HTTPS trust
        shell: bash
        run: |
          set -eu
          MD_TLS_SELFTEST="https://github.com/denoland/deno/releases/download/v2.9.5/deno-x86_64-unknown-linux-gnu.zip" \
            "${{ matrix.exe }}" | tee tls-selftest.txt
          grep -q "certifi: True" tls-selftest.txt
          grep -q "TLS self-test passed" tls-selftest.txt

      - name: Fetch the shared compatibility fixture
        uses: actions/download-artifact@v8
        with:
          name: compatibility-fixture
          path: media

      # Every platform converts the SAME VP9 + Opus MP4 -- the shape that
      # reached a real iPhone and would not play -- through the frozen
      # application's own code and its own FFmpeg discovery. macOS only has to
      # do what a user needs of it: decode VP9, encode H.264.
      - name: Packaged media compatibility
        shell: bash
        run: |
          set -eu
          FFPROBE="$(python -c "
          import pathlib
          from media_downloader.tools.manager import ToolManager
          root = pathlib.Path('tooling').resolve()
          env = {k: str(root) for k in ('XDG_DATA_HOME','LOCALAPPDATA','HOME','USERPROFILE')}
          d = ToolManager(env=env).managed_dir('ffmpeg')
          print(d / 'ffprobe' if d else '')
          ")"
          if [ -z "$FFPROBE" ]; then
            echo "No managed FFmpeg on this platform; the conversion cannot be checked here."
            exit 1
          fi
          echo "source fixture:"
          "$FFPROBE" -v error -show_entries stream=codec_name,codec_type,pix_fmt \
            -of default=noprint_wrappers=1 media/incompatible.mp4
          # Point the application's app data at the managed install and give it
          # nothing else: this is the owner's machine, where FFmpeg exists only
          # because the application put it there. Discovery has to work.
          XDG_DATA_HOME="$MD_TOOLING_ROOT" LOCALAPPDATA="$MD_TOOLING_ROOT" \
          HOME="$MD_TOOLING_ROOT" USERPROFILE="$MD_TOOLING_ROOT" \
          MD_COMPAT_SELFTEST="$PWD/media/incompatible.mp4" "${{ matrix.exe }}" | tee compat.txt
          grep -q "compatibility self-test passed" compat.txt
          # Passing is not enough: it has to have used the managed copy. A
          # bare "ffprobe" here would mean discovery was bypassed again.
          python - <<'EOF'
          import os
          import pathlib

          root = pathlib.Path(os.environ["MD_TOOLING_ROOT"]).resolve()
          report = pathlib.Path("compat.txt").read_text(encoding="utf-8")
          line = next(
              line for line in report.splitlines() if line.startswith("discovered ffprobe:")
          )
          # Split once, so a Windows drive letter survives.
          probe = pathlib.Path(line.split(":", 1)[1].strip()).resolve()
          if root not in probe.parents:
              raise SystemExit(f"ffprobe came from {probe}, not from the managed install at {root}")
          print(f"confirmed: the managed ffprobe did the work ({probe})")
          EOF
          echo "result:"
          "$FFPROBE" -v error -show_entries stream=codec_name,profile,pix_fmt \
            -show_entries format=format_name -of default=noprint_wrappers=1 \
            media/incompatible.mp4

      - name: Artifact metadata and checksum
        shell: bash
        run: |
          python packaging/artifact_info.py "${{ matrix.artifact_path }}" \
            "package/artifact-info.json" "package/${{ matrix.archive }}" \
            --commit "$GITHUB_SHA" --mode "${{ matrix.mode }}"
          cd package
          if command -v shasum >/dev/null; then
            shasum -a 256 "${{ matrix.archive }}" > "${{ matrix.archive }}.sha256"
          else
            sha256sum "${{ matrix.archive }}" > "${{ matrix.archive }}.sha256"
          fi
          cat "${{ matrix.archive }}.sha256"

      # Clearly separated and non-blocking: a transient change at an external
      # service must never make a good artifact look broken. A failure here is
      # still visible in the run.
      # Deliberately non-blocking, and deliberately not the gate that proves
      # format selection works. YouTube from a datacentre address is an
      # unstable dependency -- bot checks, regional differences, formats that
      # change by the week -- so the deterministic proof is the offline
      # selector suite, which runs the real yt-dlp selection engine against
      # fixed format matrices. This is here because a real download through
      # the frozen application still catches things a matrix cannot.
      - name: Real YouTube download (non-blocking network gate)
        continue-on-error: true
        shell: bash
        run: |
          set -u
          URL="https://www.youtube.com/watch?v=jNQXAC9IVRw"
          mkdir -p youtube/universal youtube/original

          echo "--- metadata ---"
          "${{ matrix.exe }}" "$URL" --info || echo "metadata lookup failed"

          echo "--- universal ---"
          if "${{ matrix.exe }}" "$URL" -o youtube/universal --compatibility universal; then
            FILE="$(find youtube/universal -type f | head -1)"
            FFPROBE="$(python -c "
          import pathlib
          from media_downloader.tools.manager import ToolManager
          root = pathlib.Path('tooling').resolve()
          env = {k: str(root) for k in ('XDG_DATA_HOME','LOCALAPPDATA','HOME','USERPROFILE')}
          d = ToolManager(env=env).managed_dir('ffmpeg')
          print(d / 'ffprobe' if d else '')
          ")"
            "$FFPROBE" -v error -show_entries stream=codec_name,profile,pix_fmt \
              -show_entries format=format_name -of default=noprint_wrappers=1 "$FILE" | tee probe.txt
            grep -q "codec_name=h264" probe.txt
            grep -q "codec_name=aac" probe.txt
            grep -q "profile=LC" probe.txt
            grep -q "pix_fmt=yuv420p" probe.txt
            grep -q "format_name=mov,mp4" probe.txt
            echo "universal output is h264 + aac LC + yuv420p in mp4"
          else
            echo "universal download failed"
          fi

          echo "--- original ---"
          if "${{ matrix.exe }}" "$URL" -o youtube/original --compatibility original; then
            find youtube/original -type f -printf "  kept as %f\n" 2>/dev/null \
              || find youtube/original -type f
            echo "original download completed without normalisation"
          else
            echo "original download failed"
          fi

      # archive: false uploads the single file as-is, so what gets downloaded
      # IS this archive -- no wrapper zip and no second extraction. In that
      # mode the action deliberately ignores `name` and takes the artifact name
      # from the filename, which is why every job produces a distinct one.
      - name: Upload the manual-test archive
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.archive }}
          path: package/${{ matrix.archive }}
          archive: false
          retention-days: 14
          if-no-files-found: error

      - name: Upload checksum and metadata
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.archive }}-metadata
          path: |
            package/artifact-info.json
            package/${{ matrix.archive }}.sha256
          retention-days: 14
          if-no-files-found: error

      - name: Download the artifact back
        uses: actions/download-artifact@v8
        with:
          name: ${{ matrix.archive }}
          path: roundtrip
          # Raw bytes, not an extraction: the comparison is the whole point.
          skip-decompress: true

      # Proves the file a human downloads is byte-for-byte the file this job
      # tested. Without it, everything above is a claim about a local file.
      - name: Verify the uploaded artifact round-trips unchanged
        shell: bash
        run: |
          python - <<'EOF'
          import hashlib, pathlib, sys

          def digest(path):
              h = hashlib.sha256()
              with open(path, "rb") as handle:
                  for block in iter(lambda: handle.read(1024 * 1024), b""):
                      h.update(block)
              return h.hexdigest()

          local = pathlib.Path("package/${{ matrix.archive }}")
          fetched = pathlib.Path("roundtrip/${{ matrix.archive }}")
          if not fetched.is_file():
              sys.exit(f"the artifact did not come back as a file: {fetched}")
          before, after = digest(local), digest(fetched)
          print(f"uploaded   {before}")
          print(f"downloaded {after}")
          if before != after:
              sys.exit("the downloaded artifact is not the file this job tested")
          print("round trip verified: byte-for-byte identical")
          EOF
